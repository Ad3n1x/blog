<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share Your Thoughts</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
  <h1 class="bg-info text-center">Add Blog</h1>

  <form class="container" id="addBlog">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Image URL</label>
      <input type="text" class="form-control" name="image" required />
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Title</label>
      <input type="text" class="form-control" name="title" required />
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Content</label>
      <input type="text" class="form-control" name="content" required />
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Author</label>
      <input type="text" class="form-control" name="author" required />
    </div>
    <!-- <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Likes</label>
      <input type="number" class="form-control" name="likes" required />
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Publish</label>
      <input type="checkbox" class="form-check-input" name="isPublish" />
    </div> -->
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <div id="display" style="display: flex;
  flex-wrap: wrap;"></div>
  <button onclick="goBack()" style="      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 25px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
  ">Log Out</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function goBack() {
      window.location.href = './index.html'
    }
  </script>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",
      authDomain: "marchcohort26.firebaseapp.com",
      projectId: "marchcohort26",
      storageBucket: "marchcohort26.appspot.com",
      messagingSenderId: "607896390362",
      appId: "1:607896390362:web:b1dd3b7f55fb84d86af3e3",
      measurementId: "G-5HDDLBXGBT",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const colRef = collection(db, "blogfulldescription");
    console.log(colRef);

    const addBlog = document.getElementById('addBlog');
    console.log(addBlog);


    const blogArr = [];


    addBlog.addEventListener("submit", (event) => {
      event.preventDefault();
      createBlogPost();
    });


    async function createBlogPost() {
      let formData = {
        image: addBlog.image.value,
        title: addBlog.title.value,
        content: addBlog.content.value,
        author: addBlog.author.value,
        likes: addBlog.likes.value,
        isPublish: addBlog.isPublish.checked
      };

      // Check if blog already exists
      const exists = blogArr.some(
        blog => blog.title.toLowerCase() === formData.title.toLowerCase()
      );

      if (exists) {
        alert("Blog already exists");
        return;
      }

      try {
        const docRef = await addDoc(colRef, formData);

        // Add to local array only after successful Firestore write
        blogArr.push(formData);

        console.log("Document written with ID:", docRef.id);
        alert("Blog added successfully!");

      } catch (error) {
        console.error("Error adding blog:", error);
      }
    }

  </script>
</body>

</html>
