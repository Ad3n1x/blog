<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Sign in — FIELDNOTES</title>
<style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--text:#f4f2e9;--muted:#a4a69a;--line:#34362e;--accent:#c8f169;--serif:Georgia,serif;--sans:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 15%,#26301b 0,transparent 40%),var(--bg);color:var(--text);font-family:var(--sans);display:grid;place-items:center;padding:24px}.shell{width:min(440px,100%)}.brand{display:inline-block;font-size:20px;font-weight:850;letter-spacing:-.04em;margin-bottom:30px}.brand span{color:var(--accent)}.card{border:1px solid var(--line);border-radius:20px;background:#191a17ef;padding:clamp(24px,6vw,38px);box-shadow:0 25px 80px #0004}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font:400 42px/1.08 var(--serif);letter-spacing:-.04em;margin:13px 0}p{color:var(--muted);font-size:13px;margin:0 0 27px}label{display:block;font-size:12px;color:#dddcd3;margin:17px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#11120f;color:var(--text);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #c8f16920}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:999px;background:var(--accent);color:#16180f;font-weight:850;cursor:pointer}button:hover{background:#dcff9a}button:disabled{opacity:.65;cursor:wait}.foot{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}.foot a,.back{color:var(--accent)}.backline{display:block;margin-top:22px;text-align:center;color:var(--muted);font-size:12px}.message{font-size:12px;margin-top:14px;color:var(--accent);min-height:18px}.fine{font-size:11px;color:#77796f;margin-top:22px;text-align:center}
</style></head><body><main class="shell"><a class="brand" href="./index.html">FIELDNOTES<span>.</span></a><form class="card" id="signInForm"><div class="eyebrow">Good to have you back</div><h1>Your next chapter<br>starts here.</h1><p>Sign in to continue to your writing space.</p><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in ↗</button><div class="message" id="message" role="status"></div><div class="foot">New to FIELDNOTES? <a href="./auth.html">Create an account</a></div><a class="backline" href="./index.html">← Back to FIELDNOTES</a></form><div class="fine">A good story is always worth coming back to.</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";const config={apiKey:"AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",authDomain:"marchcohort26.firebaseapp.com",projectId:"marchcohort26",storageBucket:"marchcohort26.appspot.com",messagingSenderId:"607896390362",appId:"1:607896390362:web:b1dd3b7f55fb84d86af3e3",measurementId:"G-5HDDLBXGBT"};const auth=getAuth(initializeApp(config)),form=document.getElementById("signInForm"),button=form.querySelector("button"),message=document.getElementById("message");form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Signing in…";message.textContent="";try{await signInWithEmailAndPassword(auth,form.email.value.trim(),form.password.value);location.href="./addblog.html"}catch(error){console.error(error);message.textContent=error.code==="auth/invalid-credential"?"Email or password is incorrect.":error.code==="auth/too-many-requests"?"Too many attempts. Please wait and try again.":"Could not sign in. Please try again.";button.disabled=false;button.textContent="Sign in ↗"}});
</script></body></html>
