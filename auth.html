<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · FIELDNOTES</title>
  <meta name="description" content="Create your FIELDNOTES account." />
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    .auth-card h1 {
      font-size: 1.9rem;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
    }

    .auth-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <form class="auth-card" id="signUpForm">
    <h1>Create Account</h1>
    <p class="text-secondary text-center">Join FIELDNOTES to publish and manage your writing.</p>
    <div id="formMessage" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="mb-3">
      <label class="form-label" for="fullname">Full Name</label>
      <input type="text" class="form-control" id="fullname" name="fullname" autocomplete="name" maxlength="100" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="254" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="address">Address (optional)</label>
      <input type="text" class="form-control" id="address" name="address" autocomplete="street-address" maxlength="200" />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required />
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>

    <div class="auth-footer">
      <a href="./create.html">Already have an account? Sign In</a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",
      authDomain: "marchcohort26.firebaseapp.com",
      projectId: "marchcohort26",
      storageBucket: "marchcohort26.appspot.com",
      messagingSenderId: "607896390362",
      appId: "1:607896390362:web:b1dd3b7f55fb84d86af3e3",
      measurementId: "G-5HDDLBXGBT",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const signUpForm = document.getElementById("signUpForm");
    const formMessage = document.getElementById("formMessage");
    const submitButton = signUpForm.querySelector('button[type="submit"]');

    function showMessage(message, type = "danger") {
      formMessage.textContent = message;
      formMessage.className = `alert alert-${type}`;
    }

    signUpForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullname = signUpForm.elements.fullname.value.trim();
      const email = signUpForm.elements.email.value.trim().toLowerCase();
      const address = signUpForm.elements.address.value.trim();
      const password = signUpForm.elements.password.value;

      if (fullname.length < 2) {
        showMessage("Please enter your full name.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account…";
      formMessage.className = "alert d-none";

      try {
        const credentials = await createUserWithEmailAndPassword(auth, email, password);

        // Firebase Authentication handles passwords. Never store plaintext passwords in Firestore.
        await setDoc(doc(db, "users", credentials.user.uid), {
          uid: credentials.user.uid,
          fullname,
          email,
          ...(address ? { address } : {}),
          createdAt: serverTimestamp()
        });

        showMessage("Your account was created successfully. Redirecting…", "success");
        window.location.href = "./index.html";
      } catch (error) {
        console.error("Account creation failed:", error);
        const messages = {
          "auth/email-already-in-use": "An account already exists for this email. Please sign in instead.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Choose a stronger password with at least 8 characters.",
          "auth/network-request-failed": "Network error. Check your connection and try again.",
          "permission-denied": "Your profile could not be saved. Please check the Firestore security rules."
        };
        showMessage(messages[error.code] || "We couldn't create your account. Please try again.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Sign Up";
      }
    });
  </script>

</body>

</html>
