<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    .auth-card h1 {
      font-size: 1.9rem;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
    }

    .auth-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <form class="auth-card" id="signUpForm">
    <h1>Create Account</h1>

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" name="fullname" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control" name="email" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" class="form-control" name="address" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required />
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>

    <div class="auth-footer">
      <a href="./create.html">Already have an account? Sign In</a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",
      authDomain: "marchcohort26.firebaseapp.com",
      projectId: "marchcohort26",
      storageBucket: "marchcohort26.appspot.com",
      messagingSenderId: "607896390362",
      appId: "1:607896390362:web:b1dd3b7f55fb84d86af3e3",
      measurementId: "G-5HDDLBXGBT",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const userColRef = collection(db, "users");

    const signUpForm = document.getElementById("signUpForm");

    signUpForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      let fullname = signUpForm.fullname.value;
      let email = signUpForm.email.value;
      let address = signUpForm.address.value;
      let password = signUpForm.password.value;

      try {
        const usersCredentials = await createUserWithEmailAndPassword(auth, email, password);

        await addDoc(userColRef, {
          uid: usersCredentials.user.uid,
          fullname,
          email,
          address,
          password
        });

        alert(`Signup successful`);
        window.location.href = './index.html';

      } catch (error) {
        console.log(error.message);
        if (error.message.includes("auth/email-already-in-use")) {
          alert(`Email already exists, try another one`);
        }
      }
    });
  </script>

</body>

</html>
