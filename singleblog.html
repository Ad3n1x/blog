<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <h1>Single Blog page</h1>
    <div id="display"></div>

    <button onclick="goBack()">Go back</button>
  </body>

  <script>
      function goBack(){
        window.location.href = './index.html'
    }
  </script>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
    } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
          const firebaseConfig = {
        apiKey: "AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",
        authDomain: "marchcohort26.firebaseapp.com",
        projectId: "marchcohort26",
        storageBucket: "marchcohort26.appspot.com",
        messagingSenderId: "607896390362",
        appId: "1:607896390362:web:b1dd3b7f55fb84d86af3e3",
        measurementId: "G-5HDDLBXGBT",
      };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search.substring(1));

    const blogId = urlParams.get("id");

    let docRef;

    if (!blogId) {
      alert("no blog id found");
    } else {
      docRef = doc(db, "marchblog", blogId);
    }

    async function getSingleBlog() {
      if (!docRef) {
        alert("no blog");
        return;
      }

      try {
        const docSnapShot = await getDoc(docRef);
        console.log(docSnapShot);

        if (docSnapShot.exists()) {
          const data = docSnapShot.data();

          const blog = { id: docSnapShot.id, ...data };

          displaySingleBlog(blog);
        }
      } catch (error) {
        console.log(error);
      }
    }

    function displaySingleBlog(blogs) {
      let display = document.getElementById("display");

      display.innerHTML += `
    
     <div style="border:2px solid black;width:500px;padding:10px;margin: 10px;">
                 <img src="${blogs.image}" alt="" style="width:400px">
                 <h1>${blogs.title}</h1>
                 <p>${blogs.content}</p>
                 <h3>Author: ${blogs.author}</h3>
                
                <p>Likes: ${blogs.likes}</p>
                
                <h4>Publish: ${blogs.isPublish ? "Published" : "Not yet publish"}</h4>
                
    </div>
    
    `;
    };

  

    getSingleBlog();
  </script>
</html>
