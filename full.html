<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Blog</title>

    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 850px;
        margin: 40px auto;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      .banner {
        width: 100%;
        height: 350px;
        object-fit: cover;
      }

      .content {
        padding: 35px;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 15px;
        color: #222;
        font-weight: 700;
      }

      .meta {
        color: #777;
        font-size: 15px;
        margin-bottom: 25px;
      }

      p {
        font-size: 18px;
        line-height: 1.8;
        color: #444;
        margin-bottom: 20px;
      }

      .back-btn {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 22px;
        background: #007bff;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 16px;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: #0056b3;
      }
    </style>
  </head>

  <body>
    <div id="display"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

           const firebaseConfig = {
        apiKey: "AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",
        authDomain: "marchcohort26.firebaseapp.com",
        projectId: "marchcohort26",
        storageBucket: "marchcohort26.appspot.com",
        messagingSenderId: "607896390362",
        appId: "1:607896390362:web:b1dd3b7f55fb84d86af3e3",
        measurementId: "G-5HDDLBXGBT",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const params = new URLSearchParams(window.location.search);
      const index = params.get("index");

      const blogsfull = [];

      async function loadBlog() {
        const colRef = collection(db, "blogfulldescription");
        const querySnapshot = await getDocs(colRef);

        querySnapshot.docs
          .sort((a, b) => a.id.localeCompare(b.id))
          .forEach((doc) => {
            blogsfull.push({ id: doc.id, ...doc.data() });
          });

        const blog = blogsfull[index];

        let display = document.getElementById("display");
        display.innerHTML = `
          <div class="container">
              <img src="${blog.image}" class="banner">

              <div class="content">
                  <h1>Full ${blog.title}</h1>

                  <div class="meta">
                    <strong>Author:</strong> ${blog.author} • 
                    <strong>Likes:</strong> ${blog.likes} • 
                    <strong>Status:</strong> ${blog.published ? "Published" : "Not published"}
                  </div>

                  <p>${blog.content}</p>

                  <a class="back-btn" href="index.html">← Back to Blogs</a>
              </div>
          </div>
        `;
        if (!blog) {
          display.innerHTML = "<p>Blog not found.</p>";
          return;
        }
      }

      loadBlog();
    </script>
  </body>
</html>
