<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Story — FIELDNOTES</title>
<style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--text:#f4f2e9;--muted:#a4a69a;--line:#34362e;--accent:#c8f169;--serif:Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(880px,calc(100% - 32px));margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);font-size:13px}.brand{font-weight:850;letter-spacing:-.04em;font-size:20px}.brand span{color:var(--accent)}.back{color:var(--muted)}.back:hover{color:var(--accent)}.article{padding:45px 0 85px}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;font-weight:800}.article h1{font-family:var(--serif);font-size:clamp(40px,7vw,72px);line-height:1.04;font-weight:400;letter-spacing:-.05em;margin:18px 0}.dek{font-size:17px;color:var(--muted);max-width:650px}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:24px 0}.banner{width:100%;max-height:470px;object-fit:cover;border-radius:15px;border:1px solid var(--line);background:var(--panel)}.body-copy{font-family:var(--serif);font-size:19px;line-height:1.95;color:#e3e1d8;margin:35px auto;max-width:720px;white-space:pre-wrap;overflow-wrap:anywhere}.status{border-top:1px solid var(--line);padding-top:18px;font:12px var(--sans);color:var(--muted)}.state{padding:50px 0;color:var(--muted)}@media(max-width:600px){.article{padding-top:32px}.body-copy{font-size:18px}.nav{padding:18px 0}}
</style></head><body><header class="wrap nav"><a class="brand" href="./index.html">FIELDNOTES<span>.</span></a><a class="back" href="./index.html">← All stories</a></header><main class="wrap" id="display"><div class="state">Opening story…</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
const config={apiKey:"AIzaSyDwr9_5onPlyZTBBcZa_JPdh0wBxauvB9Y",authDomain:"marchcohort26.firebaseapp.com",projectId:"marchcohort26",storageBucket:"marchcohort26.appspot.com",messagingSenderId:"607896390362",appId:"1:607896390362:web:b1dd3b7f55fb84d86af3e3",measurementId:"G-5HDDLBXGBT"};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const display=document.getElementById("display");const index=Number(new URLSearchParams(location.search).get("index"));
try{const snap=await getDocs(collection(getFirestore(initializeApp(config)),"blogfulldescription"));const posts=snap.docs.sort((a,b)=>a.id.localeCompare(b.id)).map(d=>({id:d.id,...d.data()}));const b=Number.isInteger(index)&&index>=0?posts[index]:null;if(!b){display.innerHTML='<div class="state"><h1>Story not found</h1><p>This story may have moved or the link may be incomplete.</p><a class="back" href="./index.html">← Return to all stories</a></div>'}else{document.title=(b.title||"Story")+" — FIELDNOTES";display.innerHTML='<article class="article"><div class="eyebrow">Fieldnotes / Story</div><h1>'+esc(b.title||"Untitled story")+'</h1><p class="dek">A perspective from '+esc(b.author||"a guest writer")+'. Take a moment, settle in, and read on.</p><div class="meta"><span>By '+esc(b.author||"Guest writer")+'</span><span>'+(b.published?"Published":"Community submission")+'</span><span>'+(Number(b.likes)||0)+' likes</span></div>'+(b.image?'<img class="banner" src="'+esc(b.image)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="body-copy">'+esc(b.content||"No story content was provided.")+'</div><div class="status">You’ve reached the end. Thanks for reading FIELDNOTES.</div></article>'}}catch(e){console.error(e);display.innerHTML='<div class="state"><h1>Could not open this story.</h1><p>Please check your connection and try again.</p><a class="back" href="./index.html">← Return to all stories</a></div>'}
</script></body></html>
